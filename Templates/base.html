
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Website{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('project') }}">Project</a>
            <a href="{{ url_for('contact') }}">Contact</a>
            <a href="{{ url_for('taskschool_dashboard') }}">TaskSchool</a>
            <a href="{{ url_for('eduhub') }}">EduHub</a>
            <a href="{{ url_for('edulab') }}">Edulab Interactive Simulation</a>    
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>My Website © 2026</p>
    </footer>

</body>
</html>
